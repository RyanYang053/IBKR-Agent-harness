name: Offline Acceptance Gate CI

on:
  push:
    branches: [ main, g1-offline-verified ]
  pull_request:
    branches: [ main ]

jobs:
  offline-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G1 Offline Release Gate
        run: python validation/release_gate.py --root .
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            validation/report.json
            validation/report.md
            validation/evidence/
